<button (click)="menuOpen = true" class="lg:hidden mx-2">
    <i class="fa-solid fa-bars-staggered text-xl"></i>
</button>

<aside [class.translate-x-0]="menuOpen" [class.translate-x-full]="!menuOpen"
    class="fixed top-0 right-0 z-50 h-screen w-80 bg-white shadow-2xl transition-transform duration-500 ease-in-out">

    <div class="flex items-center justify-between p-4">

        <div class="flex items-center gap-1">
            <h1 class="text-2xl font-semibold">Menu</h1>
        </div>

        <button (click)="menuOpen=false"
            class="bg-gray-100 rounded cursor-pointer transition-all hover:scale-95">

            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-x-icon lucide-x">
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
            </svg>
        </button>

    </div>

    <nav class="uppercase text-md font-semibold">

        <a href="#home" class="block px-8 py-4 hover:text-[#F97316] transition">
            Início
        </a>

        <a href="#services" class="block px-8 py-4 hover:text-[#F97316] transition">
            Serviços
        </a>

        <a href="#projects" class="block px-8 py-4 hover:text-[#F97316] transition">
            Projetos
        </a>

        <a href="#about" class="block px-8 py-4 hover:text-[#F97316] transition">
            Sobre
        </a>

        <a href="#contact" class="block px-8 py-4 hover:text-[#F97316] transition">
            Contato
        </a>

    </nav>

    <div class="absolute bottom-8 left-0 w-full px-8">
        <a target="_blank" href="https://wa.me/"
            class="flex items-center gap-2 w-full items-center gap-2 uppercase font-semibold text-md text-white px-4 py-2 bg-[#F97316] rounded-full cursor-pointer">
            <i class="fa-brands fa-rocketchat text-2xl"></i>
            Fazer orçamento
        </a>
    </div>

</aside>
